[project]
name = "reconcile-db"
version = "0.1.0"
description = "reconcile loop for managed databases"
readme = "README.md"
authors = [
    { name = "buflallo", email = "ha.lachqar@gmail.com" }
]
requires-python = ">=3.12"
dependencies = []

[project.scripts]
reconcile-db = "reconcile_db:main"

[build-system]
requires = ["uv_build>=0.13.9,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]
